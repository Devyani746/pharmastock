<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaStock | B2B Distribution & FEFO Engine</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = "http://localhost:4000/api";

    function App() {
      const [view, setView] = useState('stockist');
      const [metrics, setMetrics] = useState(null);
      const [inventory, setInventory] = useState([]);
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);
      const [actionMsg, setActionMsg] = useState(null);

      // Inward Batch Form State
      const [form, setForm] = useState({
        sku: '',
        name: '',
        composition: '',
        batchNumber: '',
        expiryDate: '',
        quantity: '',
        purchasePrice: '',
        mrp: '',
        supplier: 'Apex Pharma Labs'
      });

      // Retailer Cart State { medicineId: quantity }
      const [cart, setCart] = useState({});

      const showNotification = (msg, isError = false) => {
        setActionMsg({ text: msg, isError });
        setTimeout(() => setActionMsg(null), 4000);
      };

      const loadData = async () => {
        try {
          const [mRes, iRes, oRes] = await Promise.all([
            fetch(`${API_BASE}/metrics`).then(r => r.json()),
            fetch(`${API_BASE}/inventory`).then(r => r.json()),
            fetch(`${API_BASE}/orders`).then(r => r.json())
          ]);
          setMetrics(mRes);
          setInventory(iRes);
          setOrders(oRes);
          setLoading(false);
        } catch (err) {
          console.error("Fetch failed:", err);
          showNotification("Failed to fetch from backend at " + API_BASE, true);
          setLoading(false);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      // Inward Batch Submission
      const handleInwardBatch = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/inventory/batch`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to inward batch');
          showNotification(`Batch ${form.batchNumber} recorded successfully!`);
          setForm({
            sku: '', name: '', composition: '', batchNumber: '',
            expiryDate: '', quantity: '', purchasePrice: '', mrp: '', supplier: 'Apex Pharma Labs'
          });
          loadData();
        } catch (err) {
          showNotification(err.message, true);
        }
      };

      // Order State Machine Progression
      const handleUpdateStatus = async (orderId, nextStatus) => {
        try {
          const res = await fetch(`${API_BASE}/orders/${orderId}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: nextStatus })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Status transition failed');
          showNotification(`Order status updated to ${nextStatus}`);
          loadData();
        } catch (err) {
          showNotification(err.message, true);
        }
      };

      // Retailer Cart Management
      const handleQuantityChange = (medId, val, maxStock) => {
        const qty = Math.max(0, Math.min(Number(val) || 0, maxStock));
        setCart(prev => ({ ...prev, [medId]: qty }));
      };

      const handlePlaceOrder = async () => {
        const items = Object.entries(cart)
          .filter(([_, qty]) => qty > 0)
          .map(([medId, qty]) => {
            const med = inventory.find(m => m.id === Number(medId));
            const activeBatch = med.batches.find(b => new Date(b.expiryDate) >= new Date()) || med.batches[0];
            return {
              medicineId: med.id,
              name: med.name,
              quantity: qty,
              unitPrice: activeBatch ? activeBatch.mrp : 50.00
            };
          });

        if (items.length === 0) {
          return showNotification("Please select at least one item quantity", true);
        }

        try {
          const res = await fetch(`${API_BASE}/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              retailerName: 'Sanjeevani Chemist (Self-Serve)',
              retailerContact: '+91 98231 44510',
              items
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to place order');
          showNotification(`Order ${data.orderNumber} placed successfully!`);
          setCart({});
          loadData();
        } catch (err) {
          showNotification(err.message, true);
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen text-slate-600 font-semibold">
            Connecting to PharmaStock Engine on http://localhost:4000...
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Operational Navigation */}
          <header className="bg-[#184C78] text-white px-8 py-3.5 flex justify-between items-center shadow sticky top-0 z-50">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-xl font-black tracking-wider uppercase text-blue-200">PharmaStock</span>
                <span className="text-xs bg-[#2980B9] text-white px-2 py-0.5 rounded font-bold uppercase">FEFO Engine</span>
              </div>
              <p className="text-xs text-blue-100 mt-0.5">B2B Distribution & Expiry Risk Management</p>
            </div>

            <div className="flex bg-blue-950/60 p-1 rounded-lg border border-blue-400/20">
              <button
                onClick={() => setView('stockist')}
                className={`px-4 py-1.5 rounded-md text-xs font-bold transition-all ${
                  view === 'stockist' ? 'bg-[#2980B9] text-white shadow' : 'text-blue-200 hover:text-white'
                }`}
              >
                Stockist Command Center
              </button>
              <button
                onClick={() => setView('retailer')}
                className={`px-4 py-1.5 rounded-md text-xs font-bold transition-all ${
                  view === 'retailer' ? 'bg-[#2980B9] text-white shadow' : 'text-blue-200 hover:text-white'
                }`}
              >
                Retailer Self-Serve Portal
              </button>
            </div>
          </header>

          {/* Toast Notification */}
          {actionMsg && (
            <div className={`p-3 text-center text-xs font-bold ${actionMsg.isError ? 'bg-red-500 text-white' : 'bg-emerald-600 text-white'}`}>
              {actionMsg.text}
            </div>
          )}

          {view === 'stockist' ? (
            <main className="max-w-7xl mx-auto p-6 space-y-6 flex-1 w-full">
              {/* 1. Top KPI Summary Cards */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Inventory Value</span>
                  <div className="text-2xl font-bold text-[#184C78] mt-1">₹{metrics?.totalInventoryValue?.toLocaleString() || '0'}</div>
                </div>
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Sales Revenue (Today)</span>
                  <div className="text-2xl font-bold text-emerald-600 mt-1">₹{metrics?.todaySales?.toLocaleString() || '0'}</div>
                </div>
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pending Orders</span>
                  <div className="text-2xl font-bold text-amber-600 mt-1">{metrics?.pendingOrders || 0} Orders</div>
                </div>
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Stock-Out Alerts</span>
                  <div className="text-2xl font-bold text-red-600 mt-1">{metrics?.criticalStockCount || 0} SKUs</div>
                </div>
              </div>

              {/* 2. Expiry Risk Horizon Auditing Widget */}
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-3">Expiry Risk Horizon (Working Capital Exposure)</h2>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                  <div className="p-3 bg-red-50 border border-red-200 rounded-lg">
                    <span className="text-xs text-red-700 font-bold block uppercase">Expired (Locked)</span>
                    <span className="text-lg font-black text-red-800">₹{metrics?.expiryRisk?.expired?.toLocaleString() || 0}</span>
                  </div>
                  <div className="p-3 bg-orange-50 border border-orange-200 rounded-lg">
                    <span className="text-xs text-orange-700 font-bold block uppercase">Critical (≤ 30 Days)</span>
                    <span className="text-lg font-black text-orange-800">₹{metrics?.expiryRisk?.exp30?.toLocaleString() || 0}</span>
                  </div>
                  <div className="p-3 bg-amber-50 border border-amber-200 rounded-lg">
                    <span className="text-xs text-amber-700 font-bold block uppercase">Medium (31–60 Days)</span>
                    <span className="text-lg font-black text-amber-800">₹{metrics?.expiryRisk?.exp60?.toLocaleString() || 0}</span>
                  </div>
                  <div className="p-3 bg-yellow-50 border border-yellow-200 rounded-lg">
                    <span className="text-xs text-yellow-800 font-bold block uppercase">Watchlist (61–90 Days)</span>
                    <span className="text-lg font-black text-yellow-900">₹{metrics?.expiryRisk?.exp90?.toLocaleString() || 0}</span>
                  </div>
                </div>
              </div>

              {/* 3. Inward Batch Entry Form */}
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 className="text-xs font-bold text-[#184C78] uppercase tracking-wider mb-3">+ Inward Batch Entry (Stockist Inbound)</h2>
                <form onSubmit={handleInwardBatch} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
                  <input
                    type="text" placeholder="SKU (e.g. SKU-PCM-500)" required
                    value={form.sku} onChange={e => setForm({ ...form, sku: e.target.value })}
                    className="p-2 border rounded border-slate-300 focus:ring-1 focus:ring-blue-500 outline-none"
                  />
                  <input
                    type="text" placeholder="Medicine Name" required
                    value={form.name} onChange={e => setForm({ ...form, name: e.target.value })}
                    className="p-2 border rounded border-slate-300 focus:ring-1 focus:ring-blue-500 outline-none"
                  />
                  <input
                    type="text" placeholder="Composition"
                    value={form.composition} onChange={e => setForm({ ...form, composition: e.target.value })}
                    className="p-2 border rounded border-slate-300 focus:ring-1 focus:ring-blue-500 outline-none"
                  />
                  <input
                    type="text" placeholder="Batch Number (e.g. BATCH-901)" required
                    value={form.batchNumber} onChange={e => setForm({ ...form, batchNumber: e.target.value })}
                    className="p-2 border rounded border-slate-300 focus:ring-1 focus:ring-blue-500 outline-none"
                  />
                  <input
                    type="date" required
                    value={form.expiryDate} onChange={e => setForm({ ...form, expiryDate: e.target.value })}
                    className="p-2 border rounded border-slate-300 focus:ring-1 focus:ring-blue-500 outline-none"
                  />
                  <input
                    type="number" placeholder="Quantity Received" required min="1"
                    value={form.quantity} onChange={e => setForm({ ...form, quantity: e.target.value })}
                    className="p-2 border rounded border-slate-300 focus:ring-1 focus:ring-blue-500 outline-none"
                  />
                  <input
                    type="number" step="0.01" placeholder="Purchase Price (₹)" required
                    value={form.purchasePrice} onChange={e => setForm({ ...form, purchasePrice: e.target.value })}
                    className="p-2 border rounded border-slate-300 focus:ring-1 focus:ring-blue-500 outline-none"
                  />
                  <input
                    type="number" step="0.01" placeholder="Retail MRP (₹)" required
                    value={form.mrp} onChange={e => setForm({ ...form, mrp: e.target.value })}
                    className="p-2 border rounded border-slate-300 focus:ring-1 focus:ring-blue-500 outline-none"
                  />
                  <button type="submit" className="col-span-1 sm:col-span-2 lg:col-span-4 bg-[#184C78] text-white py-2 rounded-lg font-bold hover:bg-blue-900 transition">
                    Inward Batch into Active Ledger
                  </button>
                </form>
              </div>

              {/* 4. Master Multi-Batch Inventory Table */}
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 className="text-xs font-bold text-[#184C78] uppercase tracking-wider mb-3">Master Multi-Batch Inventory Table</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-100 text-slate-600 border-b">
                      <tr>
                        <th className="p-3">SKU / Medicine</th>
                        <th className="p-3">Category</th>
                        <th className="p-3">Available Stock</th>
                        <th className="p-3">Run-Out Indicator</th>
                        <th className="p-3">Batch Breakdown (Batch No | Expiry | Units | Price)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {inventory.map(med => {
                        const totalQty = med.batches.reduce((sum, b) => sum + b.quantity, 0);
                        const daysToStockout = med.averageDailyDemand > 0 ? (totalQty / med.averageDailyDemand).toFixed(1) : 'N/A';
                        const isCritical = Number(daysToStockout) <= med.leadTimeDays;

                        return (
                          <tr key={med.id} className="hover:bg-slate-50">
                            <td className="p-3 font-bold text-slate-800">
                              {med.name}
                              <span className="font-mono text-[10px] text-slate-400 block">{med.sku}</span>
                            </td>
                            <td className="p-3 text-slate-600">{med.category || 'General'}</td>
                            <td className="p-3 font-black text-slate-900">{totalQty} pcs</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${isCritical ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                {daysToStockout} days {isCritical && '⚠️ CRITICAL'}
                              </span>
                            </td>
                            <td className="p-3">
                              <div className="space-y-1">
                                {med.batches.map(b => {
                                  const isExpired = new Date(b.expiryDate) < new Date();
                                  return (
                                    <div key={b.id} className={`p-1 rounded flex justify-between text-[11px] ${isExpired ? 'bg-red-50 text-red-600 line-through' : 'bg-slate-100 text-slate-700'}`}>
                                      <span>#{b.batchNumber} (Exp: {b.expiryDate.split('T')[0]})</span>
                                      <span>{b.quantity} pcs @ ₹{b.purchasePrice}</span>
                                    </div>
                                  );
                                })}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* 5. Order Processing Pipeline */}
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 className="text-xs font-bold text-[#184C78] uppercase tracking-wider mb-3">Order Processing Pipeline (FEFO State Machine)</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-100 text-slate-600 border-b">
                      <tr>
                        <th className="p-3">Order Number</th>
                        <th className="p-3">Retailer</th>
                        <th className="p-3">Line Items</th>
                        <th className="p-3">Total Value</th>
                        <th className="p-3">Status</th>
                        <th className="p-3">Fulfillment Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {orders.map(o => (
                        <tr key={o.id}>
                          <td className="p-3 font-mono font-bold text-[#184C78]">{o.orderNumber}</td>
                          <td className="p-3">{o.retailerName}</td>
                          <td className="p-3">
                            {o.items.map((item, i) => (
                              <div key={i} className="text-[11px] text-slate-600">{item.medicineName} × {item.quantity}</div>
                            ))}
                          </td>
                          <td className="p-3 font-bold">₹{o.totalAmount.toLocaleString()}</td>
                          <td className="p-3">
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800">{o.status}</span>
                          </td>
                          <td className="p-3 space-x-1">
                            {o.status === 'PLACED' && (
                              <button onClick={() => handleUpdateStatus(o.id, 'CONFIRMED')} className="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded font-bold text-[11px]">Confirm</button>
                            )}
                            {o.status === 'CONFIRMED' && (
                              <button onClick={() => handleUpdateStatus(o.id, 'DISPATCHED')} className="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1 rounded font-bold text-[11px]">Dispatch</button>
                            )}
                            {o.status === 'DISPATCHED' && (
                              <button onClick={() => handleUpdateStatus(o.id, 'DELIVERED')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded font-bold text-[11px]">Deliver & Deduct (FEFO)</button>
                            )}
                            {o.status === 'DELIVERED' && (
                              <span className="text-emerald-600 font-bold text-[11px]">✓ Fulfilled (Stock Deducted)</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          ) : (
            <main className="max-w-5xl mx-auto p-6 space-y-6 flex-1 w-full">
              {/* Retailer Self-Serve Order Desk */}
              <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h2 className="text-lg font-bold text-[#184C78]">Retailer Digital Order Desk</h2>
                <p className="text-xs text-slate-500 mb-6">Select requested medicine quantities and generate instant digital purchase orders.</p>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {inventory.map(med => {
                    const validStock = med.batches
                      .filter(b => new Date(b.expiryDate) >= new Date())
                      .reduce((sum, b) => sum + b.quantity, 0);
                    const activeBatch = med.batches.find(b => new Date(b.expiryDate) >= new Date()) || med.batches[0];
                    const mrp = activeBatch ? activeBatch.mrp : 50.00;

                    return (
                      <div key={med.id} className="p-4 border border-slate-200 rounded-xl bg-slate-50 flex justify-between items-center">
                        <div>
                          <div className="font-bold text-slate-800">{med.name}</div>
                          <div className="text-xs text-slate-500">{med.composition}</div>
                          <div className="text-sm font-bold text-emerald-700 mt-2">₹{mrp} / unit</div>
                          <div className="text-xs text-slate-400">Available: {validStock} units</div>
                        </div>
                        <input
                          type="number"
                          min="0"
                          max={validStock}
                          placeholder="0"
                          value={cart[med.id] || ''}
                          onChange={e => handleQuantityChange(med.id, e.target.value, validStock)}
                          className="w-20 p-2 border rounded-lg text-center font-bold text-sm bg-white border-slate-300 focus:ring-1 focus:ring-blue-500"
                        />
                      </div>
                    );
                  })}
                </div>

                <div className="mt-8 border-t border-slate-100 pt-4 flex justify-between items-center">
                  <span className="text-sm text-slate-600 font-semibold">
                    Line Items Selected: {Object.values(cart).filter(q => q > 0).length}
                  </span>
                  <button onClick={handlePlaceOrder} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-bold transition shadow">
                    Submit Digital Purchase Order
                  </button>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
